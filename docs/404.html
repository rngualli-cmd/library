<!DOCTYPE html>
<html lang="es-EC">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Página no encontrada — Terra Enlace</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#000000">
  <link rel="icon" type="image/png" href="/assets/logo/icono-principal.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500&display=swap">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 2rem 1.25rem;
      font-family: "Inter", system-ui, sans-serif;
      color: #FFFFFF;
      background: #000000;
      text-align: center;
    }
    main { max-width: 34rem; }
    .mark {
      display: grid;
      place-items: center;
      width: 56px;
      height: 56px;
      margin: 0 auto 2rem;
      border-radius: 50%;
      background: #16294C;
    }
    .mark img { width: 34px; height: auto; }
    .code {
      font-family: "Instrument Serif", Georgia, serif;
      font-size: clamp(5rem, 3rem + 10vw, 8rem);
      line-height: 1;
      color: #5CB245;
      margin: 0;
    }
    h1 {
      font-family: "Instrument Serif", Georgia, serif;
      font-weight: 400;
      font-size: clamp(1.8rem, 1.4rem + 2vw, 2.6rem);
      line-height: 1.15;
      margin: 1rem 0;
    }
    p { color: rgba(255,255,255,.58); line-height: 1.6; margin: 0 0 2rem; font-weight: 300; }
    a.btn {
      display: inline-flex;
      align-items: center;
      min-height: 48px;
      padding: .85rem 1.5rem;
      border-radius: 999px;
      background: #FFFFFF;
      color: #0E1C36;
      font-weight: 500;
      text-decoration: none;
    }
    a.btn:hover { background: #f2f2f2; }
    a:focus-visible { outline: 2px solid #5CB245; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">
      <img src="/assets/logo/icono-amarillo.png" alt="" width="304" height="256">
    </div>
    <p class="code" aria-hidden="true">404</p>
    <h1>Esta página se perdió en el camino</h1>
    <p>La dirección que buscas no existe o fue movida. Volvamos al inicio, del campo al mercado.</p>
    <a class="btn" href="/">Volver al inicio</a>
  </main>
</body>
</html>
